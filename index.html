<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考勤打卡系统</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⏰</text></svg>">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1 class="title">考勤打卡系统</h1>
            <div class="clock-container">
                <div id="clock-display" class="clock-display">00:00:00</div>
                <div id="date-display" class="date-display">YYYY年MM月DD日</div>
            </div>
        </header>

        <main class="main-content">
            <section class="stats-panel">
                <div class="stat-card">
                    <span class="stat-label">打卡总数</span>
                    <span class="stat-value" id="total-count">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">正常次数</span>
                    <span class="stat-value" id="normal-count">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">迟到次数</span>
                    <span class="stat-value" id="late-count">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">早退次数</span>
                    <span class="stat-value" id="early-departure-count">0</span>
                </div>
            </section>

            <section class="action-panel">
                <button id="clock-in-btn" class="action-btn clock-in-btn">上班打卡</button>
                <button id="clock-out-btn" class="action-btn clock-out-btn">下班打卡</button>
            </section>

            <section class="history-panel">
                <h2 class="section-title">打卡记录</h2>
                <div class="table-container">
                    <table class="records-table">
                        <thead>
                            <tr>
                                <th>类型</th>
                                <th>时间</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody id="records-body">
                            <!-- Records will be inserted here -->
                        </tbody>
                    </table>
                </div>
                <button id="clear-btn" class="clear-btn">清空打卡记录</button>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
